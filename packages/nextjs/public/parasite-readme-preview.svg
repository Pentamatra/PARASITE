    <linearGradient id="edge"><stop stop-color="#dc86db"/><stop offset=".6" stop-color="#64467e"/><stop offset="1" stop-color="#82dfdc"/></linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#c7b4e9" stroke-opacity=".045"/></pattern>
