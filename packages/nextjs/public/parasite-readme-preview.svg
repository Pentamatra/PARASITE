<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">PARASITE — Your Wallet Is Alive</title>
  <desc id="desc">A violet wallet nucleus connected to pink and amber permission organisms on a dark background. Discover. Understand. Exterminate.</desc>
